variables:
  random: &random
    min: 0
    max: 19
    step: 1
    default: 0
  commRadius: &commRadius
    formula: 1.6
    
seeds:
  scenario: *random
  simulation: *random

network-model:
  type: EuclideanDistance
  parameters: [*commRadius]
  
#incarnation: protelis
incarnation: scafi

pools:
  - pool: &program
    - time-distribution: 1
      type: Event
      actions:
        - type: RunScafiProgram #RunProtelisProgram
          parameters: [gradient, 20]
    #- time-distribution: null
    #  program: send
  - pool: &turnIntoFake
    - time-distribution: 
        type: Trigger
        parameters: [22]
      type: Event
      actions:
        - type: SetLocalMoleculeConcentration
          parameters: [fake, 1]  
      
positions:
  type: Continuous2DEuclidean
  
displacements:
  - in:
      type: Grid 
      parameters: [0, 0, 30, 30, 1, 1, 0.2, 0.2]
    programs: 
      - *program
    contents:
      - molecule: source
        concentration: 0 # false
      - molecule: fake
        concentration: 0 # false
      - molecule: commRadius
        concentration: *commRadius
  - in:
      type: Point
      parameters: [15, 15]
    programs: 
      - *program
    contents:
      - molecule: source
        concentration: 1 # true
      - molecule: fake
        concentration: 0 # false
      - molecule: commRadius
        concentration: *commRadius
  - in:
      type: Point
      parameters: [22, 22]
    programs: 
      - *program
      - *turnIntoFake
    contents:
      - molecule: source
        concentration: 0 # false
      - molecule: fake
        concentration: 0 # false
      - molecule: commRadius
        concentration: *commRadius